# Ephemeral stack for backend integration tests (`make test-integration`).
# No Keycloak: tests mint their own JWTs against a fake JWKS in-process.
# No real vLLM: uses the same mock service as dev.
#
# Port policy (see docs/takeoff-pipeline.md's Compose-collision note): NONE
# of these host ports are actually used by the test suite today --
# tests/conftest.py's postgres_container/redis_container fixtures spin up
# their OWN separate, dynamically-ported containers via `testcontainers`
# (never these services), and every test that touches S3_ENDPOINT/
# VLLM_API_BASE sets them to an intentionally-unreachable placeholder
# (http://s3.invalid, http://vllm.invalid/v1) rather than a real endpoint.
# Postgres/Redis host ports are dropped entirely below (there's no code
# path that would ever use them, so a port that doesn't exist can't
# collide with anything, ever). SeaweedFS/mock-vllm keep host ports, moved
# to a dedicated 58xxx/59xxx block well away from both this project's dev
# stack (8333/9333/8000, deploy/docker-compose.yml) and common local
# defaults, in case a future test talks to them directly over HTTP.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: installtec_core_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      APP_DB_USER: installtec_app
      APP_DB_PASSWORD: test
      MIGRATOR_DB_USER: installtec_migrator
      MIGRATOR_DB_PASSWORD: test
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -s3"
    ports:
      - "58333:8333"
      - "59333:9333"
    tmpfs:
      - /data

  mock-vllm:
    build: ../ai-service/mock-vllm
    ports:
      - "58000:8000"
