# Base service definitions reproduce MASTER_SRS.MD §6 verbatim (image names,
# env var names, volumes, ports). Additions beyond the SRS template are
# marked inline and documented in docs/deploy-deltas.md.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/installtec_core
  DB_PASSWORD: ${DB_PASSWORD}
  APP_DB_USER: ${APP_DB_USER:-installtec_app}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  APP_DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-installtec_app}:${APP_DB_PASSWORD}@postgres:5432/installtec_core
  MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:-installtec_migrator}
  MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
  MIGRATOR_DATABASE_URL: postgresql+asyncpg://${MIGRATOR_DB_USER:-installtec_migrator}:${MIGRATOR_DB_PASSWORD}@postgres:5432/installtec_core
  DEMO_TENANT_ID: ${DEMO_TENANT_ID:-8f14e45f-ceea-4e97-8d0c-3d3b3f3c1a00}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT: http://seaweedfs:8333
  # --- addition: browser-facing host for presigned drawing-download URLs
  # (Phase 8b's PDF viewer) -- S3_ENDPOINT only resolves inside this
  # compose network. See docs/module-frontend-phase8b-plan.md. ---
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_DRAWINGS: ${S3_BUCKET_DRAWINGS:-installtec-drawings}
  S3_BUCKET_PROCUREMENT: ${S3_BUCKET_PROCUREMENT:-installtec-procurement}
  S3_FORCE_PATH_STYLE: "true"
  VLLM_API_BASE: http://vllm:8000/v1
  VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
  VLLM_API_KEY: ${VLLM_API_KEY:-not-needed}
  VLLM_TIMEOUT_S: ${VLLM_TIMEOUT_S:-120}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-onnx}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  ONNX_MODEL_DIR: ${ONNX_MODEL_DIR:-/models}
  KEYCLOAK_BASE_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-installtec}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-installtec-backend}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-installtec-backend}
  SESSION_SECRET: ${SESSION_SECRET}
  AUDIT_CHECKPOINT_HMAC_KEY: ${AUDIT_CHECKPOINT_HMAC_KEY}
  AUDIT_ALL_READS: ${AUDIT_ALL_READS:-false}
  # --- addition: gates DXF geometric-entity persistence in index_sheets
  # (app/workers/tasks/takeoff.py) -- see docs/takeoff-pipeline.md. Was
  # previously only a Settings() default with no compose wiring at all,
  # so there was no way to turn it on via .env; found while verifying the
  # Phase 2 geometry extractors end-to-end. ---
  TAKEOFF_PERSIST_GEOMETRY: ${TAKEOFF_PERSIST_GEOMETRY:-false}
  # --- addition: Module C1 RFQ dispatch. Defaults point at the Mailpit
  # service below (dev SMTP catch-all with a web UI) -- EMAIL_REDIRECT_ALL_TO
  # is also required whenever APP_ENV != production regardless of SMTP_HOST,
  # so even a misconfigured non-prod SMTP_HOST can never actually reach a
  # vendor (see app/procurement/mailer.py::resolve_recipient and
  # docs/procurement-rfq.md). ---
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-procurement@installtec.local}
  EMAIL_REPLY_TO_LOCAL_PART: ${EMAIL_REPLY_TO_LOCAL_PART:-rfq}
  EMAIL_REPLY_TO_DOMAIN: ${EMAIL_REPLY_TO_DOMAIN:-installtec.local}
  EMAIL_REDIRECT_ALL_TO: ${EMAIL_REDIRECT_ALL_TO:-dev-catchall@installtec.local}
  # --- addition: Module C2 inbound quotation ingestion. Mailpit has no IMAP
  # server (verified against the pinned image -- only SMTP/POP3/HTTP), so
  # GreenMail (service below) is the dev/test IMAP source instead.
  # IMAP_DEV_ALLOWED_HOST mirrors EMAIL_REDIRECT_ALL_TO's fail-closed
  # posture for the inbound direction: whenever APP_ENV != production,
  # IMAP_HOST must equal this value or the poller refuses to start (see
  # app/workers/tasks/quotation_ingestion.py::_assert_dev_imap_host_is_safe
  # and docs/procurement-quotation-ingestion.md). ---
  IMAP_HOST: ${IMAP_HOST:-greenmail}
  IMAP_PORT: ${IMAP_PORT:-3143}
  IMAP_USE_SSL: ${IMAP_USE_SSL:-false}
  IMAP_USER: ${IMAP_USER:-rfq@installtec.local}
  IMAP_PASSWORD: ${IMAP_PASSWORD:-anything}
  IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
  IMAP_DEV_ALLOWED_HOST: ${IMAP_DEV_ALLOWED_HOST:-greenmail}
  QUOTATION_MAX_ATTACHMENT_SIZE_BYTES: ${QUOTATION_MAX_ATTACHMENT_SIZE_BYTES:-15728640}
  QUOTATION_MAX_PDF_PAGES: ${QUOTATION_MAX_PDF_PAGES:-60}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: installtec_postgres
    environment:
      POSTGRES_DB: installtec_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # --- addition: consumed by postgres/initdb/10-roles.sh to provision the
      # non-owner application role that RLS depends on (see docs/security-rls.md) ---
      APP_DB_USER: ${APP_DB_USER:-installtec_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:-installtec_migrator}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # --- addition: run extension/role/keycloak-db bootstrap SQL on first init ---
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"  # host 5433 (5432 is often taken by a local Postgres)
    # --- addition: healthcheck so dependents can wait for readiness ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [installtec]

  redis:
    image: redis:7-alpine
    container_name: installtec_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [installtec]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: installtec_seaweedfs
    # --- addition: -s3.config enables SigV4 auth instead of fully anonymous S3 ---
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - swdata:/data
      - ./seaweedfs/s3-identities.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
      - "9333:9333"
    restart: unless-stopped
    networks: [installtec]

  # --- addition: one-shot bucket creation, run via `make init-buckets` after
  # `make up`. Runs deploy/seaweedfs/init-buckets.sh inside a container on the
  # installtec network (so `seaweedfs:8333` resolves) instead of on the host,
  # which needs the `aws` CLI installed and can't resolve that hostname at
  # all -- see docs/deploy-deltas.md. Gated behind the "tools" profile so
  # `make up`/`docker compose up` never starts it on its own. ---
  init-buckets:
    image: amazon/aws-cli:2.37.1
    container_name: installtec_init_buckets
    entrypoint: ["bash", "/init-buckets.sh"]
    volumes:
      - ./seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    environment:
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-installtec}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_DRAWINGS=${S3_BUCKET_DRAWINGS:-installtec-drawings}
      - S3_BUCKET_PROCUREMENT=${S3_BUCKET_PROCUREMENT:-installtec-procurement}
      - S3_REGION=${S3_REGION:-us-east-1}
    profiles: ["tools"]
    networks: [installtec]

  # --- addition: real vLLM + GPU, SRS §6 verbatim. Disabled by default (profile "gpu").
  # Enable with `docker compose --profile gpu up vllm-gpu` once a GPU host is provisioned,
  # and point VLLM_API_BASE at http://vllm-gpu:8000/v1 (see docs/deploy-deltas.md). ---
  vllm-gpu:
    image: vllm/vllm-openai:latest
    container_name: installtec_vllm_gpu
    environment:
      - MODEL=Qwen/Qwen2.5-VL-7B-Instruct
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hfcache:/root/.cache/huggingface
    shm_size: "8gb"
    ports:
      - "8010:8000"
    restart: unless-stopped
    profiles: ["gpu"]
    networks: [installtec]

  # --- addition: Mailpit, a fake SMTP server + web UI, used as the dev/test
  # mail sink for Module C1 RFQ dispatch (SMTP_HOST default above). Catches
  # every message regardless of the "To" address, so EMAIL_REDIRECT_ALL_TO's
  # redirect target doesn't need to be a real mailbox -- open
  # http://localhost:8025 to see dispatched RFQs. See docs/procurement-rfq.md. ---
  mailpit:
    image: axllent/mailpit:latest
    container_name: installtec_mailpit
    ports:
      - "8025:8025"  # web UI
      - "1025:1025"  # SMTP
    restart: unless-stopped
    networks: [installtec]

  # --- addition: GreenMail, a disposable IMAP/SMTP test server, used as the
  # dev/test mailbox Module C2's IMAP poller polls for vendor replies
  # (IMAP_HOST default above). Mailpit (above) cannot serve this role -- it
  # has no IMAP server at all, only SMTP/POP3/HTTP (verified against the
  # pinned image's --help output). `-Dgreenmail.auth.disabled` means any
  # username/password logs in; GreenMail creates a mailbox per exact
  # recipient address on first delivery, so a simulated "vendor reply" must
  # be sent with envelope RCPT TO = IMAP_USER (the poller's one shared
  # mailbox) while its To: header carries the real plus-addressed recipient
  # -- exactly what a real folding mail provider (Gmail/Office 365/Postfix
  # with recipient_delimiter=+) would itself hand to IMAP after folding.
  # See docs/procurement-quotation-ingestion.md. ---
  greenmail:
    image: greenmail/standalone:latest
    container_name: installtec_greenmail
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
    ports:
      - "3025:3025"  # SMTP (test tooling injects simulated vendor replies here)
      - "3143:3143"  # IMAP (the poller reads from here)
    restart: unless-stopped
    networks: [installtec]

  # --- addition: mock vLLM (OpenAI-compatible /v1/chat/completions) used as the
  # default "vllm" service until a GPU instance is available. Same service name
  # and port as the SRS template so backend config never needs to change. ---
  vllm:
    build: ../ai-service/mock-vllm
    container_name: installtec_vllm
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks: [installtec]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: installtec_backend
    # --- addition: ONNX_MODEL_DIR=/models had no volume behind it, so the
    # embedding backend could never find a model no matter how it was
    # provisioned. Populate it with ai-service/embeddings/download_model.py
    # -- see that script's docstring and docs/deploy-deltas.md for the
    # exact command (it needs its own extra deps and network access, so it
    # does not run from this image).
    volumes:
      - onnxmodels:/models
    environment:
      # --- SRS §6 verbatim ---
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/installtec_core
      - REDIS_URL=redis://redis:6379/0
      - VLLM_API_BASE=http://vllm:8000/v1
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      # --- additions: Keycloak, RLS app role, Celery, embeddings, sessions, audit ---
      - APP_ENV=${APP_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_DB_USER=${APP_DB_USER:-installtec_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - APP_DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:-installtec_app}:${APP_DB_PASSWORD}@postgres:5432/installtec_core
      - MIGRATOR_DB_USER=${MIGRATOR_DB_USER:-installtec_migrator}
      - MIGRATOR_DB_PASSWORD=${MIGRATOR_DB_PASSWORD}
      - MIGRATOR_DATABASE_URL=postgresql+asyncpg://${MIGRATOR_DB_USER:-installtec_migrator}:${MIGRATOR_DB_PASSWORD}@postgres:5432/installtec_core
      - DEMO_TENANT_ID=${DEMO_TENANT_ID:-8f14e45f-ceea-4e97-8d0c-3d3b3f3c1a00}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET_DRAWINGS=${S3_BUCKET_DRAWINGS:-installtec-drawings}
      - S3_BUCKET_PROCUREMENT=${S3_BUCKET_PROCUREMENT:-installtec-procurement}
      - S3_FORCE_PATH_STYLE=true
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      - VLLM_API_KEY=${VLLM_API_KEY:-not-needed}
      - VLLM_TIMEOUT_S=${VLLM_TIMEOUT_S:-120}
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-onnx}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
      - ONNX_MODEL_DIR=${ONNX_MODEL_DIR:-/models}
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-installtec}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-installtec-backend}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-installtec-backend}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - SESSION_TTL_S=${SESSION_TTL_S:-28800}
      - AUDIT_CHECKPOINT_HMAC_KEY=${AUDIT_CHECKPOINT_HMAC_KEY}
      - AUDIT_ALL_READS=${AUDIT_ALL_READS:-false}
      - TAKEOFF_PERSIST_GEOMETRY=${TAKEOFF_PERSIST_GEOMETRY:-false}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-procurement@installtec.local}
      - EMAIL_REPLY_TO_LOCAL_PART=${EMAIL_REPLY_TO_LOCAL_PART:-rfq}
      - EMAIL_REPLY_TO_DOMAIN=${EMAIL_REPLY_TO_DOMAIN:-installtec.local}
      - EMAIL_REDIRECT_ALL_TO=${EMAIL_REDIRECT_ALL_TO:-dev-catchall@installtec.local}
      - IMAP_HOST=${IMAP_HOST:-greenmail}
      - IMAP_PORT=${IMAP_PORT:-3143}
      - IMAP_USE_SSL=${IMAP_USE_SSL:-false}
      - IMAP_USER=${IMAP_USER:-rfq@installtec.local}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-anything}
      - IMAP_MAILBOX=${IMAP_MAILBOX:-INBOX}
      - IMAP_DEV_ALLOWED_HOST=${IMAP_DEV_ALLOWED_HOST:-greenmail}
      - QUOTATION_MAX_ATTACHMENT_SIZE_BYTES=${QUOTATION_MAX_ATTACHMENT_SIZE_BYTES:-15728640}
      - QUOTATION_MAX_PDF_PAGES=${QUOTATION_MAX_PDF_PAGES:-60}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks: [installtec]

  # --- addition: Celery workers/beat for the Module B ingestion pipeline ---
  celery-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: installtec_celery_worker
    command: celery -A app.workers.celery_app worker -Q ingest,embed -c 4 -l info
    # --- addition: the `embed` queue runs OnnxEmbedder (embeddings.py),
    # which needs the same /models volume as backend -- see the comment on
    # the backend service above.
    volumes:
      - onnxmodels:/models
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [installtec]
    # --- addition: override the backend image's HEALTHCHECK (curl :8000/healthz),
    # which workers never satisfy since they run no webserver -- ping this
    # worker's own node by hostname so inspect doesn't hang waiting for
    # every node in the cluster to answer.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  celery-worker-vlm:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: installtec_celery_worker_vlm
    command: celery -A app.workers.celery_app worker -Q vlm -c 2 -l info
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm:
        condition: service_started
    restart: unless-stopped
    networks: [installtec]
    # --- addition: see celery-worker above ---
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # --- addition: Module C1 RFQ dispatch queue -- kept off the shared
  # `ingest` queue (Module B's DXF/PDF pipeline) since an SMTP relay outage
  # should never back up drawing ingestion, and vice versa. Also runs
  # Module C2's poll_inbound_mailbox (same "talk to a mail server" queue,
  # see app/workers/celery_app.py's task_routes), hence the added
  # dependency on greenmail alongside mailpit. ---
  celery-worker-email:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: installtec_celery_worker_email
    command: celery -A app.workers.celery_app worker -Q email -c 2 -l info
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      greenmail:
        condition: service_started
    restart: unless-stopped
    networks: [installtec]
    # --- addition: see celery-worker above ---
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # --- addition: Module C2 attachment safety checks + deterministic
  # pricing-sheet parsing -- untrusted-input parsing of whatever a vendor
  # attached, kept off every other queue so a hostile/oversized attachment
  # can never back up outbound RFQ dispatch, inbound polling, or Module B's
  # drawing ingestion. Never touches vLLM (no `vllm` dependency below). ---
  celery-worker-quotation:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: installtec_celery_worker_quotation
    command: celery -A app.workers.celery_app worker -Q quotation -c 2 -l info
    environment: *backend-env
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [installtec]
    # --- addition: see celery-worker above ---
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  celery-beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: installtec_celery_beat
    # --- addition: --schedule points at /tmp, not the default ./celerybeat-schedule
    # (relative to WORKDIR /app), because /app is owned by root (only COPY'd
    # as root in Dockerfile, never chowned) while the container runs as the
    # unprivileged `app` user -- beat crash-looped with "Permission denied:
    # 'celerybeat-schedule'" until this was found while verifying this item.
    command: celery -A app.workers.celery_app beat -l info --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [installtec]
    # --- addition: override the backend image's HEALTHCHECK. beat has no
    # `inspect`-style command (that's a worker RPC) and no HTTP endpoint;
    # the only real liveness signal is its own log/schedule output, which a
    # HEALTHCHECK can't cheaply inspect. Disabled rather than left pointing
    # at a check it can never pass -- `docker ps` will just show no health
    # column for this service; watch `docker logs` for "Scheduler: Sending
    # due task" to confirm it's alive.
    healthcheck:
      disable: true

  # --- addition: Keycloak identity provider (realm imported from deploy/keycloak) ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: installtec_keycloak
    command: start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${DB_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME:-localhost}
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./keycloak/realm-installtec.json:/opt/keycloak/data/import/realm-installtec.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [installtec]

  frontend:
    build: ../frontend
    container_name: installtec_frontend
