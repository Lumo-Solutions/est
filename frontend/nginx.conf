# Reverse-proxies /api/* to the backend container on the same origin the
# browser loads the SPA from, so the BFF session/CSRF cookies never cross
# origins and no CORS configuration is needed anywhere (see
# docs/module-frontend-phase8-plan.md §0).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS + a variable in proxy_pass defers resolving
    # "backend" to request time -- nginx would otherwise refuse to start at
    # all ("host not found in upstream") if the backend container isn't
    # resolvable the instant nginx boots (e.g. still starting, or briefly
    # down); with this, only API calls fail (502) until it's back.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        # $request_uri (not a rewritten $uri) so the full original path +
        # query string reaches the backend unchanged -- a variable in
        # proxy_pass suppresses nginx's usual location-prefix substitution.
        proxy_pass http://$backend_upstream$request_uri;
        # $http_host (not $host) so the port survives -- the backend uses
        # this Host header to build its own redirect_uri/OIDC callback URL
        # (request.url_for), which must come back as the frontend's origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html itself gets no explicit Cache-Control (only nginx's default
    # ETag/Last-Modified), so a browser tab that already visited the app can
    # apply heuristic freshness and keep serving its own cached copy -- and
    # therefore the stale JS bundle it references -- after a rebuild, until
    # a hard reload (docs/ui-qa-report.md). try_files' internal redirect to
    # /index.html from the SPA fallback below re-enters location matching,
    # so this one block covers both a direct "/" request and every
    # client-side route. Hashed assets (dist/assets/*) are untouched --
    # their filename already changes on every rebuild, so long-lived
    # caching there is correct and deliberate (Vite's default).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: any non-API, non-file path resolves to index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
