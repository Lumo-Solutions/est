[project]
name = "installtec-backend"
version = "0.1.0"
description = "INSTALLTEC AI Platform backend: Module A governance core, Keycloak auth, Module B takeoff engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "greenlet>=3.1",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "boto3>=1.35",
  "aioboto3>=13.2",
  "openai>=1.50",
  "httpx>=0.27",
  "pypdf>=5.1",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "ezdxf>=1.3.5",
  "rapidfuzz>=3.10",
  "Unidecode>=1.3",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43",
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "numpy>=2.0",
  "structlog>=24.4",
  "orjson>=3.10",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "tenacity>=9.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "testcontainers[postgres]>=4.8",
  "factory-boy>=3.3",
  "faker>=30.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
